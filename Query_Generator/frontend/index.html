<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Baseball Analytics</title>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;700;800"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body class="bg-gray-50" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
    <!-- HEADER -->
    <header class="flex items-center justify-between border-b border-[#eaedf1] px-10 py-3">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-4 text-[#101418]">
          <div class="size-4">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor"></path>
            </svg>
          </div>
          <h2 class="text-lg font-bold tracking-tight">Baseball Analytics</h2>
        </div>
        <div class="flex items-center gap-9 text-sm font-medium text-[#101418]">
          <a href="#">Home</a><a href="#">Players</a><a href="#">Teams</a><a href="#">Games</a><a href="#">Analytics</a>
        </div>
      </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="flex p-6 gap-4">
      <!-- QUERY RESULTS -->
      <div class="flex-1 max-w-[920px]">
        <!-- Header + CSV Button -->
        <div class="flex justify-between items-center pb-3">
          <h2 class="text-[28px] font-bold leading-tight">Current Query Results</h2>
          <button
            id="download-csv-btn"
            class="rounded-full bg-[#699bcd] text-white text-sm font-bold px-4 py-2"
            style="display: none;"
          >
            Download CSV
          </button>
        </div>

        <div class="overflow-hidden rounded-xl border border-[#d4dbe2] bg-white">
          <table class="w-full">
            <thead><tr class="bg-gray-50"></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- CHAT HISTORY + INPUT -->
      <div class="w-[360px] flex flex-col">
        <h3 class="text-2xl font-bold leading-tight pb-2">Chat History</h3>
        <div id="chat-history" class="space-y-2 flex-1 overflow-y-auto"></div>
        <div class="flex items-center gap-2 mt-4">
          <input
            id="user-input"
            type="text"
            placeholder="Type your message..."
            class="flex-1 h-12 p-3 rounded-xl border border-[#d4dbe2] text-[#101418] bg-white"
          />
          <button
            id="send-btn"
            class="h-12 px-4 rounded-full bg-[#699bcd] text-white font-bold"
          >
            Send
          </button>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
  </body>
</html>
