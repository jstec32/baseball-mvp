services:
  - type: web
    name: baseball-mvp-api
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false

  - type: web
    name: baseball-mvp-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: Query_Generator/frontend
    envVars:
      - key: VITE_API_URL
        value: https://baseball-mvp-api.onrender.com





