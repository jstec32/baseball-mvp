services:
  - type: web
    name: baseball-mvp-api
    env: python
    region: oregon
    plan: free
    buildCommand: ""
    startCommand: uvicorn Query_Generator.wrapper.main_APIs:app --host 0.0.0.0 --port 10000
    autoDeploy: true

    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false


