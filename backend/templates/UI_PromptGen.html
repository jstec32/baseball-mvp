<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Scouting Report</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #007BFF;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-top: 20px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .dropdown {
            border: 1px solid #ccc;
            background-color: white;
            position: absolute;
            max-height: 150px;
            overflow-y: auto;
            width: 100%;
            display: none;
            z-index: 1000;
        }

        .dropdown div {
            padding: 10px;
            cursor: pointer;
        }

        .dropdown div:hover {
            background-color: #e9e9e9;
        }

        #result {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="/user_dashboard">Dashboard</a> |
        <a href="/">Generate New Report</a>
    </nav>

    <div class="container">
        <h1>Generate Scouting Report</h1>

        <form id="scouting-form">
            <label for="hitter-name">Select Hitter:</label>
            <input type="text" id="hitter-name" placeholder="Start typing hitter name" autocomplete="off">
            <div id="hitter-dropdown" class="dropdown"></div>

            <label for="pitcher-name">Select Pitcher:</label>
            <input type="text" id="pitcher-name" placeholder="Start typing pitcher name" autocomplete="off">
            <div id="pitcher-dropdown" class="dropdown"></div>

            <button type="submit">Generate Scouting Report</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        let selectedHitterId = null;
        let selectedPitcherId = null;

        // Function to fetch player suggestions
        function fetchPlayerSuggestions(inputField, dropdown, query) {
            $.ajax({
                url: `/player_suggestions?query=${query}`,
                method: "GET",
                success: function (data) {
                    dropdown.empty();  // Clear previous suggestions
                    if (data.length > 0) {
                        data.forEach(player => {
                            dropdown.append(`<div class="suggestion" data-id="${player.id}">${player.name}</div>`);
                        });
                        dropdown.show();  // Show dropdown when suggestions are available

                        // Handle suggestion selection
                        $('.suggestion').on('click', function () {
                            const playerId = $(this).data('id');
                            const playerName = $(this).text();
                            inputField.val(playerName);
                            dropdown.hide();  // Hide dropdown after selection

                            // Store the selected player ID
                            if (inputField.attr('id') === 'hitter-name') {
                                selectedHitterId = playerId;
                            } else {
                                selectedPitcherId = playerId;
                            }
                        });
                    } else {
                        dropdown.hide();  // Hide dropdown if no suggestions
                    }
                },
                error: function () {
                    console.error("Failed to fetch player suggestions.");
                }
            });
        }

        // Trigger player suggestions on input
        $('#hitter-name').on('input', function () {
            const query = $(this).val();
            if (query.length >= 2) {
                fetchPlayerSuggestions($(this), $('#hitter-dropdown'), query);
            } else {
                $('#hitter-dropdown').hide();  // Hide dropdown if query is too short
            }
        });

        $('#pitcher-name').on('input', function () {
            const query = $(this).val();
            if (query.length >= 2) {
                fetchPlayerSuggestions($(this), $('#pitcher-dropdown'), query);
            } else {
                $('#pitcher-dropdown').hide();  // Hide dropdown if query is too short
            }
        });

        // Handle form submission
        $('#scouting-form').on('submit', function (e) {
            e.preventDefault();

            if (!selectedHitterId || !selectedPitcherId) {
                $('#result').text('Please select both a hitter and pitcher.');
                return;
            }

            // Send POST request to generate scouting report
            $.ajax({
                url: '/generate_scouting_report',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ hitter_id: selectedHitterId, pitcher_id: selectedPitcherId }),
                success: function (response) {
                    $('#result').html(`
                        <p>Scouting report generated successfully!</p>
                        <a href="${response.pdf_path}" target="_blank" download>
                            Download Scouting Report
                        </a>
                    `);
                },
                error: function (xhr) {
                    $('#result').text('Error generating scouting report: ' + xhr.responseText);
                }
            });
        });
    </script>
</body>
</html>
